# Dependabot yapılandırması.
#
# Gruplama ŞART: vitest ve @vitest/coverage-v8 birbirine KATI bir peer
# bağımlılıkla bağlı (coverage paketi tam sürüm eşleşmesi istiyor). Ayrı
# ayrı yükseltildiklerinde `npm ci` çözümleme hatasıyla düşer ve CI kırmızı
# olur — 2026-09-05'te tam olarak bu yaşandı (vitest 3.2.6'ya çıkarıldı,
# coverage 3.2.4'te kaldı).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # Sürümleri birlikte hareket etmek ZORUNDA olan paketler.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      # Kalan geliştirme araçları tek PR'da toplansın; bu depoda çalışma
      # zamanı bağımlılığı yok, dolayısıyla üretim grubuna gerek de yok.
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - vitest
          - '@vitest/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
