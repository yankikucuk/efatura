name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Gerçek e-Arşiv test portalına karşı E2E testlerini çalıştır'
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Kilit dosyası npm 11 ile üretiliyor; Node 20 ve 22 npm 10 ile gelir
      # ve isteğe bağlı platform paketlerini (@esbuild/*) çözemeyip `npm ci`yi
      # EUSAGE ile reddeder. Matristeki tüm sürümler aynı npm ile çalışsın.
      - run: npm i -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run check:publish
      - run: npm run check:types

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
        env:
          EFATURA_E2E: '1'
