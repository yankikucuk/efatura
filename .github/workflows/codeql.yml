name: CodeQL

# Statik güvenlik analizi. Bu kütüphane oturum token'ı taşıyor ve devlet
# sistemine istek atıyor; sızıntı ve enjeksiyon sınıfı hatalar için otomatik
# tarama ucuz bir sigorta.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
